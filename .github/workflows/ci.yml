# PR 与 main 的质量门禁：lint + 静态导出构建（构建内含 TypeScript 检查）。
# 与 README「新增学生」清单里的自检步骤一致；本地漏跑时由这里兜底。
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # puppeteer 只有 PDF/截图脚本在用，CI 不需要下载 Chromium
      PUPPETEER_SKIP_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
